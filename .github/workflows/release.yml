name: Legacy native macOS (manual build check)

# Historical Swift target only. Shared release tags no longer build the unused
# native application; the active Tauri Mac checks live in macos-tauri.yml.
on:
  workflow_dispatch:

# Notarization for the legacy target is done locally with scripts/release.sh.
# This manual workflow only verifies its build on a clean machine.
jobs:
  build-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Build Release (no signing)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
