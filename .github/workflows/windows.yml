name: Windows

# Builds the Windows app and publishes the installer.
# Triggered by tags like `v0.3.0` or `windows-v0.3.0`, or manually triggered.

on:
  push:
    tags:
      - 'v*'
      - 'windows-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version to build (e.g. v0.3.0 or 0.3.0). Leave blank to use repository version.'
        required: false
        default: ''

permissions:
  contents: write

env:
  PUBLISH: 'true'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      # Dynamically synchronize the version from the tag across tauri.conf.json, package.json, and Cargo.toml
      - name: Sync version from tag
        id: sync_version
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag }}"
          if (-not $rawTag) {
            $rawTag = "${{ github.ref_name }}"
          }
          
          # Extract semver (e.g. 0.3.0 from v0.3.0 or windows-v0.3.0)
          if ($rawTag -match '\d+\.\d+\.\d+') {
            $version = $Matches[0]
            $tagName = if ($rawTag -match '^(v|windows-v)') { $rawTag } else { "v$version" }
          } else {
            $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
            $tagName = "v$version"
          }
          
          Write-Host "Configuring build version: $version (Release Tag: $tagName)"
          
          # 1. Update src-tauri/tauri.conf.json
          $tauriConfPath = "src-tauri/tauri.conf.json"
          (Get-Content $tauriConfPath) -replace '"version":\s*"[^"]+"', "`"version`": `"$version`"" | Set-Content $tauriConfPath
          
          # 2. Update package.json
          $pkgPath = "package.json"
          (Get-Content $pkgPath) -replace '"version":\s*"[^"]+"', "`"version`": `"$version`"" | Set-Content $pkgPath
          
          # 3. Update Cargo.toml
          $cargoPath = "Cargo.toml"
          (Get-Content $cargoPath) -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$version`"" | Set-Content $cargoPath
          
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT

      # Build and pack the installer and portable archive
      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $v = "${{ steps.sync_version.outputs.version }}"
          
          # Create portable zip containing standalone executables
          Compress-Archive -Path target/release/coucou.exe, target/release/coucou-hook.exe -DestinationPath "release/Coucou-Windows-$v-portable.zip" -Force
          
          Get-ChildItem release | Format-Table Name, Length

      # Upload workflow artifacts (available in Actions tab for 14 days)
      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Windows-${{ steps.sync_version.outputs.version }}
          path: windows/release/*
          retention-days: 14

      # Publish or update GitHub Release for the tag
      - name: Publish the release
        if: env.PUBLISH == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.sync_version.outputs.version }}"
          $tag = "${{ steps.sync_version.outputs.tag_name }}"
          
          $notes = @"
          ## Coucou for Windows (DSH Edition) v$v
          
          Coucou 灵动岛挂件（深度适配 DeepSeek Harness）
          
          ### 📦 下载与安装 / Downloads:
          - **安装引导版 (推荐)**: ``Coucou-Windows-$v-setup.exe``（直接双击安装，无需管理员权限）
          - **MSI 安装包**: ``Coucou-Windows-$v.msi``
          - **绿色免安装版**: ``Coucou-Windows-$v-portable.zip``（解压即用，包含主程序与 hook）

          > 💡 **提示**: Windows SmartScreen 首次打开若提示「未知发布者」，点击「更多信息」->「仍要运行」即可。
          "@

          $exists = gh release view "$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating existing release $tag..."
            gh release upload "$tag" `
              "release/Coucou-Windows-$v-setup.exe" `
              "release/Coucou-Windows-$v.msi" `
              "release/Coucou-Windows-$v-portable.zip" `
              --clobber
          } else {
            Write-Host "Creating release $tag..."
            gh release create "$tag" `
              "release/Coucou-Windows-$v-setup.exe" `
              "release/Coucou-Windows-$v.msi" `
              "release/Coucou-Windows-$v-portable.zip" `
              --title "Coucou for Windows v$v" `
              --notes $notes
          }

      # Update the rolling windows-latest release
      - name: Update the rolling windows-latest release
        if: env.PUBLISH == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.sync_version.outputs.version }}"
          $exists = gh release view windows-latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit windows-latest --title "Coucou for Windows (latest)" --notes "Always the newest Windows build — currently v$v."
            gh release upload windows-latest `
              "release/Coucou-Windows-setup.exe" `
              "release/Coucou-Windows.msi" `
              "release/Coucou-Windows-$v-portable.zip" `
              --clobber
          } else {
            gh release create windows-latest `
              "release/Coucou-Windows-setup.exe" `
              "release/Coucou-Windows.msi" `
              "release/Coucou-Windows-$v-portable.zip" `
              --title "Coucou for Windows (latest)" `
              --notes "Always the newest Windows build — currently v$v."
          }
